sonar.organization=resolum
sonar.projectKey=resolum_alivia-users-web-application

sonar.sources=src
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/build-wrapper-dump.json

# i18n, navigation data and SVG paths are repetitive by design
sonar.cpd.exclusions=**/i18n/**,**/navigation.*.ts,**/icon-paths.ts

# No test infrastructure yet: exclude all from coverage metric
sonar.coverage.exclusions=**/*